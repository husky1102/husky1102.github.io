---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: "en" }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <link rel="stylesheet" href="{{ base_path }}/assets/css/cv-layout.css">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/cv-style.css">
  </head>

  <body class="cv-layout">
    {% include browser-upgrade.html %}
    {% include masthead.html %}
    <div class="scroll-progress" aria-hidden="true"><span></span></div>

    <div id="main" class="cv-main" role="main">
      {% include sidebar.html %}

      <main class="cv-page" aria-label="{{ page.title | default: "CV" }}">
        {{ content }}
      </main>
    </div>

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    <button class="back-to-top" type="button" aria-label="Back to top">
      <i class="fas fa-arrow-up" aria-hidden="true"></i>
    </button>

    {% include scripts.html %}

  </body>
</html>
