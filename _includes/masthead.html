{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" class="greedy-nav__toggle" aria-label="打开导航菜单" aria-expanded="false" aria-controls="site-nav-hidden-links"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item{% if page.url == link.url %} persist masthead__menu-item--current{% endif %}"><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <button type="button" class="theme-toggle__btn" aria-label="切换到深色模式" title="切换到深色模式" aria-pressed="false">
              <svg id="theme-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <defs><mask id="theme-moon-mask"><rect width="24" height="24" fill="white"/><circle class="theme-toggle__cutout" cx="25" cy="0" r="8" fill="black"/></mask></defs>
                <circle class="theme-toggle__disc" cx="12" cy="12" r="5" fill="currentColor" mask="url(#theme-moon-mask)"/>
                <g class="theme-toggle__rays" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/>
                </g>
              </svg>
            </button>
          </li>
        </ul>
        <ul id="site-nav-hidden-links" class="hidden-links hidden" aria-hidden="true" inert></ul>
      </nav>
    </div>
  </div>
</div>
