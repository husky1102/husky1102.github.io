name: Site Check

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build JavaScript
        run: npm run build:js

      - name: Verify generated JavaScript
        run: git diff --exit-code -- assets/js/main.min.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-assets.txt

      - name: Install asset verification dependencies
        run: python3 -m pip install -r requirements-assets.txt

      - name: Verify generated font subset
        run: python3 scripts/subset_site_font.py --check-generated

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Clean generated site
        run: bundle exec jekyll clean

      - name: Build Jekyll site
        run: bundle exec jekyll build --safe --trace

      - name: Run Node tests
        run: npm test
