# Personal site identity and publishing root.
title: Husky
name: Husky1102
description: 西安交通大学人工智能硕士生，关注具身智能、智能体记忆与持续学习。
url: https://husky1102.github.io
baseurl: ""
timezone: Asia/Shanghai
author:
  avatar: "avatar-gpt063.webp"

# Content is maintained in _pages and the optional publication collection.
include: [_pages, files]
collections:
  publications:
    output: true
    permalink: /publications/:path/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: site
  - scope:
      path: ""
      type: publications
    values:
      layout: paper

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /:title/
future: false
encoding: utf-8

plugins: [jekyll-sitemap, jekyll-redirect-from]
whitelist: [jekyll-sitemap, jekyll-redirect-from]

# Only publish site content and delivery assets, never development state.
exclude:
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - .agents
  - .codex
  - .cowork
  - .claude
  - .impeccable
  - .devcontainer
  - .fonttools-local
  - .DS_Store
  - "**/__pycache__/**"
  - assets/js/_home-motion.js
  - assets/js/_site.js
  - assets/js/_theme.js
  - CONTRIBUTING.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - local
  - log
  - node_modules
  - package.json
  - package-lock.json
  - requirements-assets.txt
  - README.md
  - docs
  - scripts
  - skills-lock.json
  - "*-lock.json"
  - "*.ipynb"
  - docker-compose.yaml
  - tests
  - tmp
  - vendor
