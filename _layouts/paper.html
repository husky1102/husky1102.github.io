---
layout: site
---
<article class="paper-document">
  {% if page.venue %}<p>{{ page.venue | escape }}</p>{% endif %}
  {% if page.date %}<p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time></p>{% endif %}
  {{ content }}
  {% if page.citation %}<blockquote>{{ page.citation | escape }}</blockquote>{% endif %}
  {% include paper-links.html paper=page %}
</article>
